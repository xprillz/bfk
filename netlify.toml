# Used when dragging the zip of static/ contents into Netlify
[build]
  publish = "."
  command = "echo 'Static site – nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/awards/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/network/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Custom error pages (Bonumfinanz AG)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
